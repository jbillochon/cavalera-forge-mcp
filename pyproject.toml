[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cavalera-forge-mcp"
version = "0.1.0"
description = "MCP server for Star Citizen crafting, mining and trading: recipes, quality effects, mining locations, scan signatures, refineries, prices and the UEX player marketplace."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Julien Billochon (z0rglub)" }]
keywords = ["mcp", "star-citizen", "crafting", "mining", "uex", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "mcp>=2.3,<3",
    "uex-market-mcp @ git+https://github.com/jbillochon/uex-market-mcp@v0.3.0",
]

[project.urls]
Homepage = "https://github.com/jbillochon/cavalera-forge-mcp"
Issues = "https://github.com/jbillochon/cavalera-forge-mcp/issues"

[project.scripts]
cavalera-forge-mcp = "cavalera_forge.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cavalera_forge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skill", "deploy", "README.md", "LICENSE"]
