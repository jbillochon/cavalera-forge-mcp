# Rate-limit zones for forge.cavalera.news. Included in the http block through
# /etc/nginx/conf.d/*.conf. Zone names are global: "forgemcp" and "forgedata"
# are used nowhere else. Claude.ai connectors share a few egress IPs, hence a
# generous per-IP rate on the MCP endpoint.
limit_req_zone $binary_remote_addr zone=forgemcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=forgedata:1m rate=6r/m;
